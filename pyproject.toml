[project]
name = "essenn-production-vs-plan"
version = "0.1.0"
description = "Factory part plan vs production analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.3",
    "openpyxl>=3.1.0",
    "streamlit>=1.59.2",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.15.2",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
    "pandas-stubs>=3.0.3.260530",
    "vulture>=2.14.0",
]

[tool.pyright]
typeCheckingMode = "strict"
extraPaths = ["."]
