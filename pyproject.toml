[project]
name = "essenn-production-vs-plan"
version = "0.1.0"
description = "Factory part plan vs production analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.13.5",
    "detect-secrets>=1.5.0",
    "matplotlib-stubs>=0.3.11",
    "pandas-stubs>=3.0.0.260204",
    "pip-audit>=2.10.0",
    "pyright>=1.1.408",
    "ruff>=0.15.6",
    "scikit-learn>=1.8.0",
    "scikit-learn-stubs>=0.0.3",
]



[tool.pyright]
typeCheckingMode = "strict"
