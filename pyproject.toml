[project]
name = "essenn-production-vs-plan"
version = "0.1.0"
description = "Factory part plan vs production analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.13.5",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.0",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
    "pandas-stubs>=2.0.0",
    "pytest>=7.0.0",
    "vulture>=2.14.0",
]

[tool.pyright]
typeCheckingMode = "strict"
