name: Guard My Code

on:
  push:
  pull_request:

jobs:
  guard-my-code:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        # guard-my-code.sh uses `npx jscpd`, so we install Node.js first.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install project and CI dependencies
        run: |
          uv sync
          npm install --no-save jscpd

      - name: Run guard-my-code.sh
        run: uv run bash ./guard-my-code.sh
